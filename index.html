<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Lần Này Sẽ Khác</title>

<body>
<!-- defs dùng chung cho mọi SVG trong trang (bộ lọc nét run tay, gradient) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <filter id="w" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="7" result="n"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="3"/>
    </filter>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#151B23"/><stop offset=".7" stop-color="#1B222C"/>
    </linearGradient>
    <pattern id="pave" width="60" height="30" patternUnits="userSpaceOnUse"><rect width="60" height="30" fill="#2A323D"/><path d="M0,0H60M0,15H60M15,0V15M45,15V30" stroke="#222831" stroke-width="2" fill="none"/></pattern>
    <pattern id="tileF" width="48" height="48" patternUnits="userSpaceOnUse"><rect width="48" height="48" fill="#343C47"/><path d="M0,0H48M0,0V48" stroke="#2C333D" stroke-width="2" fill="none"/></pattern>
    <pattern id="wood" width="120" height="22" patternUnits="userSpaceOnUse"><rect width="120" height="22" fill="#3B342E"/><path d="M0,0H120M70,0V22" stroke="#2E2925" stroke-width="2" fill="none"/></pattern>
    <pattern id="roof" width="34" height="22" patternUnits="userSpaceOnUse"><rect width="34" height="22" fill="#4A3532"/><path d="M0,22 Q17,8 34,22M-17,11 Q0,-3 17,11M17,11 Q34,-3 51,11" stroke="#3A2826" stroke-width="2" fill="none"/></pattern>
    <pattern id="roofG" width="18" height="40" patternUnits="userSpaceOnUse"><rect width="18" height="40" fill="#3A4250"/><path d="M0,0V40" stroke="#2F3642" stroke-width="3"/></pattern>
    <pattern id="shutter" width="20" height="8" patternUnits="userSpaceOnUse"><rect width="20" height="8" fill="#4B5560"/><path d="M0,0H20" stroke="#3A4552" stroke-width="2"/></pattern>
    <pattern id="water" width="140" height="44" patternUnits="userSpaceOnUse"><rect width="140" height="44" fill="#17212B"/><path d="M10,14 q12,-6 24,0 t24,0M80,34 q12,-6 24,0 t24,0" stroke="#273746" stroke-width="2" fill="none"/></pattern>
    <filter id="sepia"><feColorMatrix type="matrix" values=".39 .77 .19 0 0  .35 .69 .17 0 0  .27 .53 .13 0 0  0 0 0 1 0"/></filter>
    <pattern id="asph" width="60" height="40" patternUnits="userSpaceOnUse"><rect width="60" height="40" fill="#1A2028"/><circle cx="7" cy="9" r="1" fill="#252C36"/><circle cx="31" cy="23" r="1.3" fill="#141920"/><circle cx="48" cy="6" r="1" fill="#252C36"/><circle cx="19" cy="33" r="1.2" fill="#2A323D"/><circle cx="53" cy="30" r="1" fill="#141920"/><circle cx="40" cy="14" r=".8" fill="#2A323D"/></pattern>
    <radialGradient id="lampW"><stop offset="0" stop-color="#E2A050" stop-opacity=".45"/><stop offset="1" stop-color="#E2A050" stop-opacity="0"/></radialGradient>
    <radialGradient id="lamp"><stop offset="0" stop-color="#6F86A0" stop-opacity=".45"/><stop offset="1" stop-color="#6F86A0" stop-opacity="0"/></radialGradient>
  </defs>
</svg>

<div id="stage">
  <div id="world"><div id="bg"></div><div id="ents"></div><div id="fg"></div></div>
  <div id="tint"></div>
  <div id="vignette"></div>

  <div id="hud">
    <span id="hud-day"></span><span id="hud-time"></span><span id="hud-loc"></span>
    <span id="hud-cart"></span><b id="hud-money"></b>
    <button id="btn-music" aria-label="Bật tắt nhạc">♪</button>
    <button id="btn-note" aria-label="Sổ điều tra">Sổ<i id="note-badge" hidden></i></button>
    <button id="btn-bag" aria-label="Túi đồ">Túi</button>
    <button id="btn-menu" aria-label="Menu">☰</button>
  </div>
  <div id="objective"></div>
  <div id="edge-l" class="edge" hidden></div>
  <div id="edge-r" class="edge" hidden></div>

  <div id="touch">
    <div id="joyzone"></div>
    <div id="joy"><div id="joyknob"></div></div>
    <button id="btn-act" aria-label="Tương tác">●</button>
  </div>

  <div id="sellpanel" hidden></div>
  <div id="closeup" hidden></div>
  <div id="dialog" class="panel" hidden></div>
  <div id="shop" class="panel big" hidden></div>
  <div id="rest" class="panel" hidden></div>
  <div id="summary" class="panel" hidden></div>
  <div id="menu" class="panel" hidden></div>
  <div id="help" class="panel big" hidden></div>
  <div id="bag" class="panel big" hidden></div>
  <div id="notebook" class="panel big nb" hidden></div>
  <div id="ending" class="panel big" hidden></div>
  <div id="case" class="panel big" hidden></div>
  <div id="toasts"></div>
  <div id="fade"></div>

  <div id="title">
    <div id="title-art"></div>
    <h1>Lần Này Sẽ Khác</h1>
    <p>Trinh thám kinh dị · một bến sông, năm 1996 và bây giờ</p>
    <button id="btn-continue" class="primary" hidden>Chơi tiếp</button>
    <button id="btn-new">Chơi mới</button>
    <button class="music-toggle">♪ Nhạc: Bật</button>
  </div>
</div>
<div id="rotate">Xoay ngang điện thoại để chơi</div>
